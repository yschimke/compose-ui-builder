<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compose UI Builder Renderer</title>
    <script id="renderer-cache-capability">
      // An opaque-origin iframe has no Cache Storage. Its getter throws rather than returning
      // undefined; Compose Resources probes it before loading images. Expose an absent capability
      // so that probe selects direct fetch, while retaining the iframe's allow-scripts sandbox.
      try {
        void globalThis.caches;
      } catch (error) {
        if (error.name !== "SecurityError") throw error;
        Object.defineProperty(globalThis, "caches", { value: undefined, configurable: true });
      }
    </script>
    <style>
      html, body, #composeApp { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: transparent; }
      #composeApp canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "@js-joda/core": "./js-joda.esm.js" } }
    </script>
    <!-- Keep the import map first, including when modules come straight from the cache. -->
    <link rel="modulepreload" href="uiBuilderRenderer.mjs" />
    <link rel="modulepreload" href="uiBuilderRenderer.import-object.mjs" />
    <link rel="modulepreload" href="skiko.mjs" />
    <link rel="modulepreload" href="js-joda.esm.js" />
  </head>
  <body>
    <div id="composeApp"></div>
    <script type="module" src="uiBuilderRenderer.mjs"></script>
  </body>
</html>
