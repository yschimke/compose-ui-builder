org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Heap for the Kotlin compile daemon, which the Kotlin Gradle plugin otherwise starts with the
# Gradle daemon's own `-Xmx` — the 2 GB above.
#
# `:wasm-ui:compileDevelopmentExecutableKotlinWasmJs` is the peak of this build. Linking the
# development executable runs Kotlin/Wasm's ir2wasm pass over the whole world — `:wasm-ui`,
# `:native-catalog-m3`, `:slot-preview-runtime` and the Compose Multiplatform runtime, foundation,
# material3 and ui libraries they pull in — holding the IR for all of it at once. At 2 GB that pass
# died with `OutOfMemoryError: GC overhead limit exceeded` inside `DeclarationGenerator`, after
# seven minutes, and the compiler's own advice in the failure is this property.
#
# 4g, not more: `ubuntu-latest` has ~16 GB, and the Gradle daemon's 2 GB is separate. The two do not
# peak together — Gradle is idle while the Kotlin daemon links — but there is no reason to be
# careless, and a value this build does not need is a value nobody will revisit.
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true
org.jetbrains.compose.hot.reload.disable=true

# Where Gradle finds the second JDK this build needs.
#
# `:ui-builder` and `:ui-builder-artwork` compile at `java-ui-builder` (21) while everything a
# consumer resolves stays at `java-server` (17) — the two floors at the top of
# `gradle/libs.versions.toml`. Gradle runs on 17 and needs a 21 toolchain beside it.
#
# `actions/setup-java` installs into the hosted tool cache and exports `JAVA_HOME_<version>_<arch>`,
# a location Gradle's own auto-detection does not scan, so CI would otherwise fail with "No
# matching toolchains found". Naming the variables here is the documented way to add them. Both
# arches are listed because the runner image decides which one exists, and a variable that is not
# set is ignored rather than an error — which is also why this is harmless locally, where a
# contributor's 21 comes from a path Gradle already scans (`/usr/lib/jvm`, SDKMAN, asdf, jabba).
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_21_ARM64,JAVA_HOME_17_X64,JAVA_HOME_17_ARM64
