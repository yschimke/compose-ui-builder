// Opt-in compilation of the experimental Compose source using the existing desktop test lane.
gradle.projectsEvaluated {
    def builder = rootProject.findProject(':ui-builder')
    if (builder == null) return
    def proof = new File(rootProject.projectDir, 'experiments/remote-state-selection')
    def sources = builder.extensions.getByName('kotlin').sourceSets.getByName('jvmTest').kotlin
    def generated = gradle.startParameter.projectProperties.containsKey('scopedProjectionProof')
        ? 'build/scoped-projection-source/compose' : 'build/repetition-source/compose'
    sources.srcDir(new File(proof, generated))
    sources.srcDir(new File(proof, 'src/desktopTest/kotlin'))
    if (gradle.startParameter.projectProperties.get('boundActionProof') == 'true') {
        sources.srcDir(new File(proof, 'build/bound-action-source/compose'))
        sources.srcDir(new File(proof, 'src/boundActionDesktopTest/kotlin'))
    }
}
