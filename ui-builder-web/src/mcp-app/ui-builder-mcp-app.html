<!doctype html>
<!--
  The UI Builder as an MCP App: the `text/html;profile=mcp-app` resource a server serves for its
  `.uid` file entrypoint (compose-ui-builder#364). See docs/design/UI_BUILDER_MCP_APP_HOST.md.

  One small HTML document, not a self-contained one: the editor is ~75 MB of Wasm, which no host
  will take inline in a resource. Everything else loads from the origin that serves this archive,
  named by `<base href>`. A server fills in __COMPOSE_UI_BUILDER_ASSET_BASE__ (an absolute URL ending
  in `/`, the unpacked archive's root), and declares that origin in the resource's
  `_meta.ui.csp.resourceDomains` and `connectDomains`. It may also fill in
  __COMPOSE_UI_BUILDER_MCP_APP_LAYOUT__ with `focused` or `full`, the editor the panel opens in;
  left as it is, or any other value, it opens `focused`. Nothing else is substituted at serve time;
  the version was written in by the build.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compose UI Builder</title>
    <base href="__COMPOSE_UI_BUILDER_ASSET_BASE__" />
    <script>
      // Selects McpAppHostApp (see Main.kt). `assetBase` is the only origin besides the page's the
      // editor may fetch from; `catalogBase` is left unset, so a design pinned to a catalog this
      // archive does not package is refused by name rather than fetched (McpAppCatalogs.kt).
      // `layout` is the editor the panel opens in, `focused` (the canvas alone) or `full`; the
      // person can switch from the file bar either way (McpAppLayout.kt).
      globalThis.composeUiBuilderMcpApp = {
        assetBase: "__COMPOSE_UI_BUILDER_ASSET_BASE__",
        layout: "__COMPOSE_UI_BUILDER_MCP_APP_LAYOUT__",
        version: "@UI_BUILDER_VERSION@",
      };
    </script>
    <!-- Before the module preloads, as index.html explains: ShellImportMapOrderTest's rule. -->
    <script type="importmap">
      { "imports": { "@js-joda/core": "./js-joda.esm.js" } }
    </script>
    <link rel="preload" href="uiBuilder.wasm" as="fetch" type="application/wasm" crossorigin />
    <link rel="preload" href="skiko.wasm" as="fetch" type="application/wasm" crossorigin />
    <link rel="modulepreload" href="uiBuilder.mjs" />
    <link rel="modulepreload" href="uiBuilder.import-object.mjs" />
    <link rel="modulepreload" href="skiko.mjs" />
    <link rel="modulepreload" href="js-joda.esm.js" />
    <style>
      :root {
        --boot-bg: #fef7ff;
        --boot-fg: #1d1b20;
        --boot-muted: #49454f;
        --boot-track: #e7e0ec;
        --boot-accent: #6750a4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #141218;
          --boot-fg: #e6e0e9;
          --boot-muted: #cac4d0;
          --boot-track: #36343b;
          --boot-accent: #d0bcff;
        }
      }
      html, body, #composeApp { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: white; }
      #composeApp canvas { display: block; }
      #ui-builder-boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        background: var(--boot-bg); color: var(--boot-fg);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #ui-builder-boot .boot-card { width: min(360px, calc(100vw - 48px)); }
      #ui-builder-boot .boot-title { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
      #ui-builder-boot .boot-phase { margin: 0; font-weight: 500; }
      #ui-builder-boot .boot-detail {
        margin: 0; min-height: 1.45em; color: var(--boot-muted); font-variant-numeric: tabular-nums;
      }
      #ui-builder-boot .boot-track {
        position: relative; height: 4px; margin: 12px 0 16px; overflow: hidden;
        border-radius: 2px; background: var(--boot-track);
      }
      #ui-builder-boot .boot-bar {
        position: absolute; inset: 0; transform-origin: left; background: var(--boot-accent);
        transform: scaleX(0.3); animation: boot-indeterminate 1.4s ease-in-out infinite;
      }
      #ui-builder-boot[data-progress="determinate"] .boot-bar {
        animation: none; transition: transform 200ms linear;
      }
      #ui-builder-boot[data-state="failed"] .boot-bar { animation: none; background: #b3261e; }
      #ui-builder-boot .boot-quip { margin: 0; min-height: 2.9em; color: var(--boot-muted); font-style: italic; }
      @keyframes boot-indeterminate {
        from { transform: translateX(-100%) scaleX(0.3); }
        to { transform: translateX(100%) scaleX(0.3); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ui-builder-boot .boot-bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="composeApp"></div>
    <div id="ui-builder-boot" role="status" aria-live="polite">
      <div class="boot-card">
        <p class="boot-title">Compose UI Builder</p>
        <p class="boot-phase" data-boot-phase>Loading the editor</p>
        <p class="boot-detail" data-boot-detail></p>
        <div class="boot-track"><div class="boot-bar" data-boot-bar></div></div>
        <p class="boot-quip" data-boot-quip></p>
      </div>
    </div>
    <script src="ui-builder-boot.js"></script>
    <script type="module" src="uiBuilder.mjs"></script>
  </body>
</html>
