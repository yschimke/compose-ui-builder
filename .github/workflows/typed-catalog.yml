name: Typed catalog

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/validate-typed-catalog.sh'
      - '.github/workflows/typed-catalog.yml'
      - 'ui-builder-renderer-sdk/**'
      - 'ui-builder-runtime/**'
      - 'ui-builder-export/**'
      - 'ui-builder/src/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
  push:
    branches: [main]
    paths:
      - 'scripts/validate-typed-catalog.sh'
      - '.github/workflows/typed-catalog.yml'
      - 'ui-builder-renderer-sdk/**'
      - 'ui-builder-runtime/**'
      - 'ui-builder-export/**'
      - 'ui-builder/src/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typed-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Test the typed renderer bridge and its bundle installer
        run: scripts/validate-typed-catalog.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typed-catalog-test-results
          path: |
            ui-builder-renderer-sdk/build/test-results/jvmTest
            ui-builder-runtime/build/test-results/test
            ui-builder/build/test-results/jvmTest
          if-no-files-found: ignore
