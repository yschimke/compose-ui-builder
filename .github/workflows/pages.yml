name: Landing Page

# Publishes site/ to GitHub Pages.
#
# The screenshots in site/img are committed, and kept current by site-screenshots.yml, which
# re-captures them from main's editor and opens a pull request when one changed; this workflow
# deploys them as they are. What it adds at deploy time is the live editor: the latest release's
# Wasm archive, unpacked at site/editor/, where live.html opens the gallery's designs with no
# server (the editor's MCP App shell, hosted by site/js/mcp-host.js), and a fresh copy of
# preview.coo.ee's device presets.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/site-screenshots/**
      - docs/design/fixtures/ui-builder/designs/**
      - .github/workflows/pages.yml
  release:
    types: [published]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the latest released editor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern 'compose-preview-ui-builder-web-*.zip' --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/web"
          unzip -q "$RUNNER_TEMP"/compose-preview-ui-builder-web-*.zip -d "$RUNNER_TEMP/web"
      - name: Refresh the device presets
        # The hosted service's own frame catalog; the committed copy stays if it cannot be read.
        run: |
          curl -fsS --retry 3 https://preview.coo.ee/api/ui-builder/v1/device-presets -o "$RUNNER_TEMP/presets.json" \
            && python3 -m json.tool "$RUNNER_TEMP/presets.json" > /dev/null \
            && cp "$RUNNER_TEMP/presets.json" site/device-presets.json || true
      - name: Serve the editor beside the site
        # live.html runs this copy, so the gallery's "Open in the editor" is the latest release.
        run: cp -r "$RUNNER_TEMP/web" site/editor
      - name: Serve the device presets beside the editor
        # An MCP App only fetches below its asset base, so live.html names editor/device-presets.json.
        run: cp site/device-presets.json site/editor/device-presets.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
