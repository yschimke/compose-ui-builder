name: Design Renders

# Renders the committed UI-builder designs on every pull request that touches one, and posts a
# before/after comment. The baseline refreshes on every push to main.
#
# This repository's review surface for a design is pixels, exactly as the catalogs' is: a design is
# a JSON document of nodes, properties and modifiers, and a text diff of one says nothing about
# whether the screen still looks right. `docs/design/fixtures/ui-builder/designs/` holds them — the
# editor's own chrome mocks, the Google app designs, the Jetcaster reference, and the Wear samples —
# and until now the only way to see what a change to one did was to run a server and open the editor.
#
# Two lanes over that one directory, because a design compiles only against its own catalog's
# bundle: each call picks its designs by `catalogPin.systemId` (`catalog-id`), and its `lane` keeps
# its artifacts, sticky comment and render branches apart from the other's.
#
# The pipeline is `compose-preview-server design render --local`: the design's generated Kotlin,
# compiled and rasterised in-process. Both the reusable workflow and that binary are
# yschimke/compose-preview-server, which also publishes the `compose-preview-host` image the render
# runs in — so the lane, the CLI and the four sidecars a local render needs all version together.
#
# The designs are OPERATION LOGS rather than documents (`compose-ui-builder-operations/v1-candidate`),
# so the lane replays them with this repository's own `scripts/ui-builder/design-sync.mjs` first.
# That is what `documents: false` selects, and it is the default.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: ui-builder-designs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  designs:
    # Guard against a fork's pull request trying to push a render branch into this repository.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
      pull-requests: write
    uses: yschimke/compose-preview-server/.github/workflows/ui-builder-designs-reusable.yml@main
    with:
      # The Material 3 designs, against m3-catalog's own bundle off its delivery branch in the
      # m3-catalog-out output repository. No `lane`: this call keeps the comment and branches it
      # has always had.
      catalog-id: m3-catalog
      catalog-bundle: https://raw.githubusercontent.com/yschimke/m3-catalog-out/design-artifacts/m3-catalog/bundle/bundle.png
      # The record the generator proves each call site against. `m3-catalog` is record-driven, so
      # without this every `m3/*` node is refused as an unproven component.
      components: |
        m3-catalog=docs/design/fixtures/ui-builder/m3-catalog-components-v1.json

  wear-designs:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
      pull-requests: write
    uses: yschimke/compose-preview-server/.github/workflows/ui-builder-designs-reusable.yml@main
    with:
      # The Wear designs, against wear-m3-catalog's bundle. Compiled against the m3 bundle they fail
      # at `Unresolved reference 'wear'`. `wear-m3` is record-free, so there is no `components`.
      catalog-id: wear-m3
      lane: wear-m3
      catalog-bundle: https://raw.githubusercontent.com/yschimke/wear-m3-catalog-out/design-artifacts/wear-m3-catalog/bundle/bundle.png
      baseline-branch: ui-builder-designs/wear-m3
      render-branch-prefix: ui-builder-designs/wear-m3-pr
