name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request cancels its own superseded runs; a push to `main` does not cancel anything.
# `${{ github.ref }}` alone puts every push to `main` in ONE group, so each merge cancels the
# previous commit's run and commits reach `main` with no completed CI at all. A push therefore
# takes `github.run_id` — unique per run, therefore a group of one, therefore never cancelled.
# Carried over from compose-preview-server, where four commits landed untested on one day before
# it was fixed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Release-please PRs change only `.release-please-manifest.json` and `CHANGELOG.md` -- every source
# and build input is the `main` commit whose push run already verified it -- yet release-please
# rewrites the branch on every merge to `main`, so the full matrix (~45 runner-minutes) re-ran on
# each one: 17 runs on the release branch in 16 hours, every one of them queued behind the PR
# traffic on the account's shared runner pool. The heavy jobs below are skipped on those PRs, and
# `gradle` passes when they were skipped for that reason, so the release PR goes green in the time
# the cheap gates take. The guard pairs the `release-please--` head branch with the release bot as
# PR author: the branch name alone is contributor-controlled, the author is not.
# release.yml's `release-pr-ci` starts this workflow on the release branch by `workflow_dispatch`
# (the `pull_request` runs a `github.token` push raises sit at action_required), and a dispatch has
# no `head_ref` and no `pull_request`, so the guard falls back to `ref_name` and `actor`: the
# dispatching bot is the actor, and a person who dispatches on that branch gets the full run.
# Pushes to `main` are not on a `release-please--` ref, so they always run everything.
jobs:
  # `check` minus the two production Wasm executables. Each one is a link plus a Binaryen
  # `wasm-opt` pass that peaks at several GB (see `wasmLinkLane` in the root build file), so the
  # lane ran them one after the other, ~14 minutes at the tail of this job: 29 minutes in all, the
  # longest in the workflow. Each now has a runner of its own (`web-archive`, `renderer-runtime`),
  # and runs exactly once per workflow: at most one optimize per runner, none of them twice.
  # `gradle` stays as the check the ruleset requires and passes only if all three did.
  gradle-check:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Two JDKs, because this build has two JVM floors: `java-server` (17) for everything a
          # consumer compiles against, and `java-ui-builder` (21) for the frontend lane. See the
          # top of `gradle/libs.versions.toml`. 17 is last, so it is `JAVA_HOME` and Gradle itself
          # runs on the floor consumers resolve; the 21 install is reached as a toolchain through
          # `org.gradle.java.installations.fromEnv` in `gradle.properties`.
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - name: Check Markdown links
        run: ./scripts/check-markdown-links.py
      # The two JVM test suites run in `jvm-tests`: they were the last ~4 minutes of this job,
      # holding the workers the Wasm browser tests sat waiting for.
      - run: >-
          ./gradlew check ktfmtCheckAll
          -x :ui-builder-web:verifyUiBuilderWebArchive
          -x :ui-builder-renderer:verifyRendererRuntime
          -x :ui-builder:jvmTest
          -x :ui-builder-runtime:test

  # `:ui-builder:jvmTest` (~3.5 min) and `:ui-builder-runtime:test` (~4.3 min), split out of
  # `gradle-check`, which runs the rest of `check` beside them.
  jvm-tests:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      - run: ./gradlew :ui-builder:jvmTest :ui-builder-runtime:test

  # The publishing lane, the render bundle and the canvas benchmark: ~3 minutes that ran after
  # `check` in `gradle-check` and need nothing it built.
  publishing-lane:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # The publishing lane, proven WITHOUT credentials. It stages the derived release set into a
      # throwaway local repository at a snapshot version (so nothing is signed and nothing reaches
      # Maven Central), then resolves it from a synthetic consumer outside this source tree: the
      # runtime through the BOM, the web archive by its exact distribution variant, and every
      # coordinate the BOM constrains.
      #
      # This is the check that would have caught compose-preview-server's 3.3.0-3.8.0 breakage,
      # where six releases shipped a POM naming an artifact nobody had uploaded.
      # The in-tree generation the script compares the published consumer's against: a different
      # absolute checkout must generate the same bytes. `check` used to create it before this step;
      # on a fresh runner the script would find nothing and skip the comparison without a word.
      - run: ./gradlew :ui-builder-production-consumer:generateUiBuilderSources
      - name: Verify durable generation from published artifacts
        run: ./scripts/check-ui-builder-production-consumer.sh
      - name: Verify the publishing lane
        run: ./scripts/check-ui-builder-external-consumer.sh
      # One of the two archives the server consumes; the other, `:ui-builder-web:webArchive`, is
      # built and verified by `web-archive`. Naming it here is what fails the build if the
      # *packaging* regresses without a verification task noticing.
      - run: ./gradlew :ui-builder-render-bundle:jar
      # Edit-to-canvas time over the Jetcaster fixture on the JVM desktop backend (#193), not the
      # Wasm canvas. Recorded, not gated: a shared runner is too noisy for an absolute line, so the
      # numbers are kept to compare across runs.
      - name: Measure canvas frame times
        run: ./gradlew :ui-builder:canvasFrameBenchmark
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-frame-times
          path: ui-builder/build/reports/ui-builder/canvas-frame-times.json
          if-no-files-found: ignore

  # The shipped editor: `:ui-builder`'s production executable through `wasm-opt`, packaged into the
  # archive the server unpacks and verified there. The only job that builds it; the result is handed
  # to `ui-builder-web-smoke` so the browser smoke runs against these exact bytes.
  web-archive:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Binaryen only on `main`: a pull request proves the archive assembles and verifies from the
      # production link, which is already dead-code eliminated, without the ~6-minute `wasm-opt`
      # pass whose output only `main` publishes (`ProductionWasm.kt` in build-logic).
      - run: ./gradlew -PuiBuilder.wasmOpt="${WASM_OPT}" :ui-builder-web:verifyUiBuilderWebArchive
        env:
          WASM_OPT: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-builder-wasm-dist
          path: ui-builder/build/wasmDist
          if-no-files-found: error
          retention-days: 1

  # The renderer-only runtime: `:ui-builder-renderer`'s production executable through `wasm-opt`,
  # archived and verified (no editor-only code survived dead-code elimination). The only job that
  # builds it.
  renderer-runtime:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify opaque-origin Cache Storage fallback
        run: node .github/scripts/test-renderer-cache-capability.mjs
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # Binaryen only on `main`, as in `web-archive`. The editor-marker check still holds without it:
      # dead-code elimination is the production link's, not Binaryen's.
      - run: ./gradlew -PuiBuilder.wasmOpt="${WASM_OPT}" :ui-builder-renderer:verifyRendererRuntime
        env:
          WASM_OPT: ${{ github.event_name != 'pull_request' }}

  # The check the ruleset requires. It must run whatever its `needs` did, rather than be skipped,
  # because a skipped required check reads as passing; so it runs unless the workflow was cancelled
  # and fails unless every split job succeeded.
  #
  # It gates the three jobs below as well: a job outside `needs` blocks nothing, and
  # `ui-builder-web-smoke` went red on every push to `main` for a day (the editor bundle over its
  # size budget after the Kotlin 2.4.21 bump) without stopping a single merge. All three skip on
  # release-please PRs exactly as the split jobs do (`ui-builder-web-smoke` through `web-archive`),
  # which the step below already tolerates.
  gradle:
    needs:
      - gradle-check
      - jvm-tests
      - publishing-lane
      - web-archive
      - renderer-runtime
      - ui-builder-remote-compose
      - ui-builder-web-smoke
      - ui-builder-contract
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every gated job succeeded
        if: >-
          ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled'))
          && !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
        run: |
          echo "::error::A gated job did not succeed: ${NEEDS}"
          exit 1
        env:
          NEEDS: ${{ toJSON(needs.*.result) }}

  ui-builder-remote-compose:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: ./.github/actions/buildfetch-cache
        with:
          rw-token: ${{ github.event_name == 'push' && (secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN) || '' }}
          ro-token: ${{ secrets.BUILDFETCH_COMPOSEAI_GRADLE_REMOTE_CACHE_TOKEN_RO || secrets.BUILDFETCH_GRADLE_REMOTE_CACHE_TOKEN_RO }}
      # The normal Gradle job proves the shipping default. Keep the opt-in code compiled and
      # exercised against released dependencies as well, without enabling it in distributions.
      # `:mcp:test` and `:server:test` were in this list before the extraction and stayed with the
      # server, which runs the same flag in its own CI — a release pairs the two.
      - run: >-
          ./gradlew -PuiBuilderRemoteCompose=true
          :ui-builder-export:jvmTest :ui-builder:jvmTest :ui-builder-runtime:test
          :ui-builder:compileKotlinWasmJs

  # The shipped Wasm editor, opened in a real browser. Every other job proves the editor on the JVM;
  # this is the one that would notice the page itself failing to start (Skiko on WebGL, the Wasm
  # module, the page bridges), which otherwise only compose-preview-server's harness would see.
  #
  # It opens the editor `web-archive` built rather than building its own: a second
  # `:ui-builder:wasmFrontendDist` was the same 10-minute production link and `wasm-opt` again.
  ui-builder-web-smoke:
    needs: web-archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-builder-wasm-dist
          path: ui-builder/build/wasmDist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm ci
        working-directory: scripts/ui-builder-web-smoke
      - run: npm test
        working-directory: scripts/ui-builder-web-smoke
      # No function in the shipped module may grow past 200 KB. Binaryen inlined generated tables
      # (Material 3 locale strings, the icon builders) into single 328 KB and 686 KB functions, and
      # V8 held 312 MB for six seconds compiling one; `wasmNoInlinePatterns` in
      # ui-builder/build.gradle.kts keeps them apart and this fails the day one slips back. It bites
      # on `main` only: pull requests package the module without Binaryen (`WASM_OPT` above), where
      # nothing is inlined and the largest function is ~100 KB.
      - run: node wasm-functions.mjs ../../ui-builder/build/wasmDist/uiBuilder.wasm
        working-directory: scripts/ui-builder-web-smoke
      # Size budgets for the editor bundle (`budgets.json`): `uiBuilder.wasm`, `skiko.wasm`, the
      # scripts and all of `wasmDist`, raw and gzipped. The web archive adds only its 107-byte
      # manifest and the 6 KB MCP App shell to that. `main` only, like the memory budgets below: a
      # pull request's module is not Binaryen-optimised, so its sizes are not the shipped ones.
      - if: github.event_name != 'pull_request'
        run: node budgets.mjs ../../ui-builder/build/wasmDist
        working-directory: scripts/ui-builder-web-smoke
      - run: npx playwright install --with-deps chromium
        working-directory: scripts/ui-builder-web-smoke
      # The same regression seen from the browser: open a Material 3 design and fail when one Wasm
      # TurboFan compile holds over 128 MB (48 MB today, 312 MB before the inlining rules). Like the
      # check above, it can only fail on `main`'s Binaryen-optimised module. On `main` it also
      # measures the designs screen, three runs each, against the memory budgets in `budgets.json`
      # (settled renderer PSS and JS heap); a pull request keeps the one quick run.
      - run: node memory.mjs ../../ui-builder/build/wasmDist ../../build/web-memory
        working-directory: scripts/ui-builder-web-smoke
        env:
          MEMORY_MAX_TURBOFAN_ZONE_MB: '128'
          MEMORY_SCENARIOS: ${{ github.event_name != 'pull_request' && 'designs,open-m3-catalog' || 'open-m3-catalog' }}
          MEMORY_RUNS: ${{ github.event_name != 'pull_request' && '3' || '1' }}
          MEMORY_BUDGETS: ${{ github.event_name != 'pull_request' && 'budgets.json' || '' }}
          MEMORY_VIEWPORT: desktop
      - run: node smoke.mjs ../../ui-builder/build/wasmDist ../../build/web-smoke
        working-directory: scripts/ui-builder-web-smoke
      # The same editor as an MCP App in a fake host: open, no-op, select, save, external edit.
      - run: node mcp-app-host.mjs ../../ui-builder/build/wasmDist ../../docs/design/fixtures/ui-builder/state-actions.uid ../../build/web-smoke
        working-directory: scripts/ui-builder-web-smoke
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-builder-web-smoke
          path: |
            build/web-smoke
            build/web-memory
          if-no-files-found: ignore
      # The landing page's screenshots, from this checkout's editor rather than the last release, so
      # a change to the editor shows what it does to the page (site/README.md). Advisory: a moved
      # click point is a capture to re-tune, not a broken editor.
      - run: npm ci
        working-directory: scripts/site-screenshots
      - run: node capture.mjs ../../ui-builder/build/wasmDist ../../build/site-screenshots
        continue-on-error: true
        working-directory: scripts/site-screenshots
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-screenshots
          path: build/site-screenshots
          if-no-files-found: ignore

  ui-builder-contract:
    if: ${{ !(startsWith(github.head_ref || github.ref_name, 'release-please--') && (github.event.pull_request.user.login || github.actor) == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm test
        working-directory: scripts/ui-builder
      # The readiness gate's own tests. A check nobody invokes is indistinguishable from a check
      # that passes.
      - run: .github/scripts/test-ui-builder-equivalence.sh
      # Catalog knowledge in the builder's main sources only moves down: each catalog-id literal is
      # a fact a catalog should publish instead (UI_BUILDER_CATALOG_CONTRACT.md § Success criteria).
      - name: Catalog-id ratchet
        run: .github/scripts/catalog-id-ratchet.sh
      # The Maven publish plan decides which coordinates a release uploads to Central. A wrongly
      # skipped module is unrepairable (Central refuses a version twice) and a needlessly full plan
      # burns quota, and nothing but a real release ever runs it, so both directions and every
      # fail-open path are pinned against a fixture repository (#247).
      - name: Run Maven publish plan tests
        run: .github/scripts/test-maven-publish-plan.sh
      # Relabels a release PR whose release was cut outside release-please; only ever runs for real
      # on the push after such a release, so which PRs it may touch is pinned here.
      - name: Run release PR relabel tests
        run: .github/scripts/test-release-pr-mark-tagged.sh
      - name: remote-m3 catalog-level equivalence
        run: |
          .github/scripts/ui-builder-equivalence.sh \
            --policy docs/design/fixtures/ui-builder/remote-m3-published-v1.json \
            --golden docs/design/fixtures/ui-builder/remote-m3-capabilities-v1.json \
            --differences docs/design/fixtures/ui-builder/remote-m3-differences.json \
            --catalog-id remote-m3 \
            --component-id-prefix "remote-m3/" \
            --strict
      - name: wear-m3 catalog-level equivalence
        run: |
          .github/scripts/ui-builder-equivalence.sh \
            --policy docs/design/fixtures/ui-builder/wear-m3-published-v1.json \
            --golden docs/design/fixtures/ui-builder/wear-m3-capabilities-v1.json \
            --differences docs/design/fixtures/ui-builder/wear-m3-differences.json \
            --catalog-id wear-m3 \
            --component-id-prefix "wear-m3/" \
            --strict

      - name: m3 catalog-level equivalence
        run: |
          .github/scripts/ui-builder-equivalence.sh \
            --policy docs/design/fixtures/ui-builder/m3-catalog-generated-published-v1.json \
            --golden docs/design/fixtures/ui-builder/m3-catalog-capabilities-v1.json \
            --differences docs/design/fixtures/ui-builder/m3-catalog-differences.json \
            --catalog-id m3-catalog \
            --component-id-prefix "m3/" \
            --strict

      - name: Wear port stays on the canvas
        run: .github/scripts/wear-port-canvas-only.sh
      - name: Hosted design services stay out of the editor
        run: .github/scripts/ui-builder-editor-service-boundary.sh
