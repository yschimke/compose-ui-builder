name: Desktop packages

# The native installers for macOS and Windows. Linux's `.deb` is built by the release job itself.
#
# Two ways in. A pull request that touches the desktop app or this file builds both, so a packaging
# break shows up before a release rather than as a missing asset after it. The release workflow
# calls it with the tag, and then the packages are also attached to that release.
on:
  pull_request:
    branches: [main]
    paths:
      - ui-builder-desktop/**
      # The app is packaged from this module too; a change here changes the installers.
      - ui-builder-host-jvm/**
      - .github/workflows/desktop-packages.yml
  # A manual run on a branch builds both packages without a pull request or a release.
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build and attach the packages to
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            extension: dmg
            format: Dmg
          - os: windows-latest
            extension: msi
            format: Msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's head commit, not `refs/pull/N/merge`: macOS runners can queue for longer
          # than a pull request stays open, and once it merges that ref is gone and the
          # checkout fails before anything is built.
          ref: ${{ inputs.tag || github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      # Recovering a tag cut before this OS had an installer: that tag's build script cannot make
      # one, and failing here would hold `finish-release` back for an asset the release never
      # had. Only a release tag is let off: a pull request or a manual run builds the current
      # script, which must package, so there the missing format is still a failure below.
      - name: Does this build package for ${{ matrix.os }}?
        id: support
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          FORMAT: ${{ matrix.format }}
          EXTENSION: ${{ matrix.extension }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          if [ -n "$TAG" ] && ! grep -q "TargetFormat.$FORMAT" ui-builder-desktop/build.gradle.kts; then
            echo "::notice::$TAG predates the .$EXTENSION installer; nothing to build on $RUNNER_LABEL"
            echo "supported=false" >> "$GITHUB_OUTPUT"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: ${{ steps.support.outputs.supported == 'true' }}
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: ${{ steps.support.outputs.supported == 'true' }}
        with:
          cache-provider: basic
      - name: Package for ${{ matrix.os }}
        if: ${{ steps.support.outputs.supported == 'true' }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            tag="$TAG"
            export UI_BUILDER_DESKTOP_VERSION="${tag#v}"
          fi
          ./gradlew :ui-builder-desktop:packageDistributionForCurrentOS
      - name: Find the package
        if: ${{ steps.support.outputs.supported == 'true' }}
        id: package
        shell: bash
        env:
          EXTENSION: ${{ matrix.extension }}
        run: |
          package=$(find ui-builder-desktop/build/compose/binaries -type f -name "*.$EXTENSION" -print -quit)
          if [ -z "$package" ]; then
            echo "::error::packageDistributionForCurrentOS produced no .$EXTENSION"
            exit 1
          fi
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.support.outputs.supported == 'true' }}
        with:
          name: compose-ui-builder-desktop-${{ matrix.extension }}
          path: ${{ steps.package.outputs.path }}
      - name: Attach to the release
        if: ${{ steps.support.outputs.supported == 'true' && inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: gh release upload "$TAG" "$PACKAGE_PATH" --clobber
