name: Release

# Triggered by a push to main, not by a tag. release-please watches the Conventional Commit
# subjects, keeps a release PR open proposing the next version, and cuts the release when that PR
# merges. A `push: tags` trigger CANNOT coexist with it: release-please creates the tag itself, so
# the tag push would fire a second, duplicate publish, and Maven Central rejects a version it
# already has. One trigger, one publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Quoted: the `chore(main): release ` literal contains `: `, which YAML would otherwise read as a
  # nested mapping. A merged release PR gets its own slot so an ordinary push cannot replace it
  # while the publish is still pending.
  group: "release-${{ github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') && github.sha || 'updates' }}"
  cancel-in-progress: false

# What a release of this repository is:
#
#   - THREE JARS AND A BOM on Maven Central — `compose-preview-ui-builder-runtime`,
#     `-export`, `-render-bundle` and `-bom`. These are what a consumer compiles or resolves
#     against. `-render-bundle` is not optional even though nobody names it directly: it is an
#     `api` dependency of the runtime, so its coordinate appears in the runtime's POM, and a POM
#     naming an artifact nobody uploaded is what made compose-preview-serve unresolvable for six
#     consecutive releases.
#
#   - ONE ZIP as a GitHub release asset — `compose-preview-ui-builder-web-<v>.zip`, the Wasm
#     editor. A host unpacks it; nothing compiles against it. compose-preview-server resolves it
#     through a group-fenced ivy repository over this release, which keeps it a normal versioned
#     dependency without putting a 40 MB frontend distribution on Central forever.
#
# The Maven set is DERIVED, never listed: `publishReleaseArtifacts` publishes every module applying
# `composeai.maven-publishing` and fails first if that set has lost a seam or the BOM.
jobs:
  # The release half. `skip-github-pull-request` is deliberate — the PR half is `update-release-pr`
  # below. A single invocation computes the next candidate PR in the same run that cuts the
  # release, and because our releases are drafts (`"draft": true` in release-please-config.json)
  # that half reads the PREVIOUS release as its baseline and re-proposes the version being
  # released. That produced a phantom PR in compose-preview-vscode#5.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # A draft release does not create its tag — GitHub writes the ref only on publish — and
      # `publish` below checks out `ref: <tag>`, then addresses the release by that tag for the
      # asset upload and the un-drafting. Without this the first release cuts a draft and then
      # dies at checkout. Idempotent, and `!cancelled()` so a late failure in the action cannot
      # leave the manifest naming a version with no tag.
      - name: Ensure the release tag exists for the draft
        if: ${{ !cancelled() && steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/{owner}/{repo}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
            exit 0
          fi
          gh api --method POST "repos/{owner}/{repo}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${SHA}" >/dev/null
          echo "created tag ${TAG} at ${SHA}"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PLUGIN_VERSION: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Derive version from tag
        run: echo "PLUGIN_VERSION=${PLUGIN_VERSION#v}" >> "$GITHUB_ENV"

      # Before anything leaves the machine. The gate stages the derived set into a throwaway local
      # repository at a snapshot version and resolves it from a consumer outside this source tree,
      # so a POM naming an unresolvable coordinate fails here rather than on Central, where it
      # cannot be taken back.
      - name: Verify the publishing lane
        run: ./scripts/check-ui-builder-external-consumer.sh

      # Built BEFORE the Central upload, not after. Everything past `publishReleaseArtifacts` is
      # irreversible - Central does not take a version back - so the last thing that can fail must
      # fail first. The gate above never builds this archive, so this step is genuinely the
      # remaining risk rather than a formality.
      - name: Build the editor archive
        run: ./gradlew :ui-builder-web:webArchive

      # These five secret names are the ones compose-preview-server used while it published these
      # same coordinates, so one set of repository secrets serves both. `signingInMemoryKeyId` is
      # the one that looks droppable and is not: without it the signing plugin uses the keyring's
      # primary key, which is the wrong key whenever the signing key is a subkey.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishReleaseArtifacts

      # The asset name is the coordinate compose-preview-server's ivy repository asks for, so this
      # filename is a contract rather than a label. `:ui-builder-web`'s `archiveBaseName` and
      # `archiveVersion` produce exactly it.
      #
      # Deliberately does NOT un-draft: `finish-release` does that once the asset is attached, so
      # the release is never visible to the ivy repository without the zip it asks for.
      - name: Attach the editor archive to the release
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          archive="ui-builder-web/build/distributions/compose-preview-ui-builder-web-${PLUGIN_VERSION}.zip"
          # release-please has already created the (draft) Release, so `view` normally succeeds.
          # The create branch covers a tag that reached here without one - a manual re-run, or a
          # release whose draft was deleted - because `gh release upload` cannot create a Release
          # and would otherwise fail AFTER the Central publish had gone out.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" --title "$tag" --generate-notes --draft
          fi

  finish-release:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, so `gh` has no git remote to infer the repository from.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the draft GitHub release
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --latest

  # The PR half, split from the release half above and run after it, for the phantom-PR reason
  # documented on `release-please`. On an ordinary push this is the only job that does anything.
  update-release-pr:
    needs: [release-please, finish-release]
    if: >-
      ${{ !cancelled()
      && (needs.release-please.outputs.release_created != 'true'
      || needs.finish-release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
