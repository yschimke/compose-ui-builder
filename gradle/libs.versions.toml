[versions]
# The two JVM floors this repository maintains, and the line between them.
#
# `java-server` is the floor of everything a *consumer* compiles or resolves against:
# `:server`, `:mcp`, `:ui-builder-runtime`, `:ui-builder-export`, `:usage-source-psi`. It is 17
# because `compose-ai-tools` pins every JVM module to a 17 toolchain and its `:cli` compiles its
# tests against our published `compose-preview-serve`, so class file 65 anywhere in that graph
# fails their build outright with "class file has wrong version 65.0, should be 61.0". That
# repository has ruled out moving while AGP and Robolectric target 17, so this number does not move
# on our schedule. `:server:checkServerJvmFloor` proves nothing above it reaches the distribution.
#
# `java-ui-builder` is the floor of the UI-builder *frontend* JVM lane — `:ui-builder` and
# `:ui-builder-artwork` — whose class files are published to nobody. They ship only inside
# `:ui-builder-render-bundle`'s polyglot PNG, as opaque bytes a render daemon unpacks; no consumer
# ever puts them on a compile classpath. That is what lets this lane sit above the line, and it is
# the seam yschimke/compose-preview-server#346 built when it moved the bundle out of the published
# runtime jar. The cost is a *runtime* one and it is real: the daemon that renders that bundle runs
# under the server's own JVM (`java.home`), so a self-hoster on 17 loses UI-builder PNG/SVG export.
# The bundle therefore carries this number as data and `ServeUiBuilderRenderPort` preflights it, so
# that lands as one sentence naming both versions rather than an `UnsupportedClassVersionError`
# from a daemon nobody knew existed (yschimke/compose-preview-server#344).
java-server = "17"
java-ui-builder = "21"
kotlin = "2.4.10"
ktfmt = "0.27.0"
ktfmt-cli = "0.64"
compose-multiplatform = "1.11.1"
graphics-shapes = "1.1.0"
maven-publish = "0.37.0"
# One ref for every compose-ai-tools coordinate, and for the Gradle plugin id it also drives.
# 1.80.0 is the first release carrying `render-matrix`, which `:mcp` needs, and the daemon-core /
# render-session-api surface the moved MCP sources compile against. The pin moved with the module
# (compose-ai-tools#5176) rather than in a Renovate bump, because the module cannot build below it.
#
# `preview-discovery` and `screen-model` were pinned apart while the release carrying
# `ScreenGenerator` ran ahead of the plugin/renderer floor this build resolved, so bumping the
# shared ref would have forced a plugin and renderer bump into the same change. That floor caught
# up at 1.80.0 — the three refs met — so the split is gone rather than left reading as a live
# constraint. Split them again only if the floor falls behind a coordinate this build needs.
composeai-tools = "1.80.0"
composeai-contracts = "2.5.0"
rc-players = "1.57.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktor = "3.5.2"
# The Model Context Protocol Kotlin SDK, behind `:mcp`. Same version compose-ai-tools' `:mcp` was
# on when the module moved here (compose-ai-tools#5176) — a move is not the moment to also change
# the protocol implementation.
mcp-kotlin-sdk = "0.15.0"
# JUnit 4 + Truth, used only by `:mcp`'s tests, which came with the module. Converting ~1.5k lines
# of assertions to `kotlin.test` is a separate change from moving them.
junit = "4.13.2"
truth = "1.4.5"
okhttp = "5.5.0"
okio = "3.18.2"
classgraph = "4.8.194"
jmdns = "3.6.3"
# The UI builder's Kotlin syntax highlighter, behind the Code pane. Pure Kotlin with a published
# wasmJs variant, which is the whole reason it is this library: the pane is a Compose `Text` on a
# canvas, so a JS/DOM highlighter (the playground's vendored CodeMirror) cannot reach it.
#
# Held at 1.0.0 because nothing this pane does needs 1.1.0 — not because it cannot be taken. Its
# blocker is gone: 1.1.0's JVM artifact is class file 65, and `:ui-builder` now compiles against
# `java-ui-builder` (21), so it would load in `:ui-builder:jvmTest` and in the JVM chrome preview
# the render evidence comes from. Read the two floors at the top of this file before taking it —
# the constraint that remains is that it must not reach `java-server`'s lane, and
# `:server:checkServerJvmFloor` is what says so rather than a comment.
snipme-highlights = "1.0.0"

[libraries]
composeai-common-web-escaping = { module = "ee.schimke.composeai:common-web-escaping", version.ref = "composeai-tools" }
# The render host, the bundle daemon and the git-backed preview history. Was this repository's own
# `:render-host` module, published as `compose-preview-render-host`, until yschimke/compose-preview-server#180
# moved it to the repository that owns everything it depends on. It has no web server and never did;
# it lived here only because it was written inside the `serve` package and came along when the server
# was extracted. Same version ref as the rest of compose-ai-tools, because it now ships on that line.
composeai-render-host = { module = "ee.schimke.composeai:render-host", version.ref = "composeai-tools" }
# The wire contract this server speaks to a `compose-preview build-host --stdio` process, so it can
# ask for local Gradle work without linking the Gradle Tooling API. Shape and framing only — that is
# what lets `checkServeModuleBoundary` keep holding while the server gains the capability
# yschimke/compose-preview-server#9 asked for.
composeai-build-host-protocol = { module = "ee.schimke.composeai:build-host-protocol", version.ref = "composeai-tools" }
composeai-preview-data-api = { module = "ee.schimke.composeai:preview-data-api", version.ref = "composeai-tools" }
composeai-preview-discovery = { module = "ee.schimke.composeai:preview-discovery", version.ref = "composeai-tools" }
# `screen-model` is the generator compiled for wasmJs as well as the JVM, which is what lets the
# browser editor reach the same `ScreenGenerator` the server exports with.
composeai-screen-model = { module = "ee.schimke.composeai:screen-model", version.ref = "composeai-tools" }
composeai-common-image-crop = { module = "ee.schimke.composeai:common-image-crop", version.ref = "composeai-tools" }
composeai-bundle-format = { module = "ee.schimke.composeai:bundle-format", version.ref = "composeai-tools" }
composeai-bundle-coordinates = { module = "ee.schimke.composeai:bundle-coordinates", version.ref = "composeai-tools" }
composeai-daemon-core = { module = "ee.schimke.composeai:daemon-core", version.ref = "composeai-tools" }
composeai-daemon-client = { module = "ee.schimke.composeai:daemon-client", version.ref = "composeai-tools" }
composeai-render-session-api = { module = "ee.schimke.composeai:render-session-api", version.ref = "composeai-tools" }
composeai-render-session-subprocess = { module = "ee.schimke.composeai:render-session-subprocess", version.ref = "composeai-tools" }
# Render-matrix axis expansion and contact-sheet composition, shared by the CLI's `render-matrix`
# command and `:mcp`'s `render_matrix` tool. Lifted out of compose-ai-tools' `:mcp` before the
# module moved here, precisely so the offline CLI command did not have to follow it (#5188 there).
composeai-render-matrix = { module = "ee.schimke.composeai:render-matrix", version.ref = "composeai-tools" }
composeai-data-pseudolocale-core = { module = "ee.schimke.composeai:data-pseudolocale-core", version.ref = "composeai-tools" }
composeai-data-remotecompose-core = { module = "ee.schimke.composeai:data-remotecompose-core", version.ref = "composeai-tools" }

