[versions]
kotlin = "2.4.10"
ktfmt = "0.27.0"
ktfmt-cli = "0.64"
compose-multiplatform = "1.11.1"
graphics-shapes = "1.1.0"
maven-publish = "0.37.0"
# 1.80.0 is the first release carrying `render-matrix`, which `:mcp` needs, and the daemon-core /
# render-session-api surface the moved MCP sources compile against. The pin moved with the module
# (compose-ai-tools#5176) rather than in a Renovate bump, because the module cannot build below it.
# It supersedes the 1.78.1 bump on main, which is a strictly lower release.
composeai-tools = "1.80.0"
composeai-contracts = "2.5.0"
# `preview-discovery` is pinned apart from the rest of compose-ai-tools because the version that
# carries `ScreenGenerator` is newer than the plugin/renderer floor this build resolves, and
# `composeai-tools` also drives the Gradle plugin id. Bumping the shared ref would force a plugin
# and renderer bump into the same change. The artifact shares no compose-ai-tools transitive with
# the rest of the floor — it depends only on kotlinx-serialization, ClassGraph and ASM — so the
# split cannot produce two versions of one internal module. Collapse it back into `composeai-tools`
# at the next Renovate bump that reaches this version.
composeai-preview-discovery = "1.78.1"
# `screen-model` is the generator compiled for wasmJs as well as the JVM, which is what lets the
# browser editor reach the same `ScreenGenerator` the server exports with. Its own ref because it
# first exists in 1.77.0, and `composeai-tools` is pinned lower.
composeai-screen-model = "1.78.1"
rc-players = "1.57.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktor = "3.5.2"
# The Model Context Protocol Kotlin SDK, behind `:mcp`. Same version compose-ai-tools' `:mcp` was
# on when the module moved here (compose-ai-tools#5176) — a move is not the moment to also change
# the protocol implementation.
mcp-kotlin-sdk = "0.15.0"
# JUnit 4 + Truth, used only by `:mcp`'s tests, which came with the module. Converting ~1.5k lines
# of assertions to `kotlin.test` is a separate change from moving them.
junit = "4.13.2"
truth = "1.4.5"
okhttp = "5.5.0"
okio = "3.18.2"
classgraph = "4.8.194"
jmdns = "3.6.3"

[libraries]
composeai-common-web-escaping = { module = "ee.schimke.composeai:common-web-escaping", version.ref = "composeai-tools" }
# The render host, the bundle daemon and the git-backed preview history. Was this repository's own
# `:render-host` module, published as `compose-preview-render-host`, until yschimke/compose-preview-server#180
# moved it to the repository that owns everything it depends on. It has no web server and never did;
# it lived here only because it was written inside the `serve` package and came along when the server
# was extracted. Same version ref as the rest of compose-ai-tools, because it now ships on that line.
composeai-render-host = { module = "ee.schimke.composeai:render-host", version.ref = "composeai-tools" }
# The wire contract this server speaks to a `compose-preview build-host --stdio` process, so it can
# ask for local Gradle work without linking the Gradle Tooling API. Shape and framing only — that is
# what lets `checkServeModuleBoundary` keep holding while the server gains the capability
# yschimke/compose-preview-server#9 asked for.
composeai-build-host-protocol = { module = "ee.schimke.composeai:build-host-protocol", version.ref = "composeai-tools" }
composeai-preview-data-api = { module = "ee.schimke.composeai:preview-data-api", version.ref = "composeai-tools" }
composeai-preview-discovery = { module = "ee.schimke.composeai:preview-discovery", version.ref = "composeai-preview-discovery" }
composeai-screen-model = { module = "ee.schimke.composeai:screen-model", version.ref = "composeai-screen-model" }
composeai-common-image-crop = { module = "ee.schimke.composeai:common-image-crop", version.ref = "composeai-tools" }
composeai-bundle-format = { module = "ee.schimke.composeai:bundle-format", version.ref = "composeai-tools" }
composeai-bundle-coordinates = { module = "ee.schimke.composeai:bundle-coordinates", version.ref = "composeai-tools" }
composeai-daemon-core = { module = "ee.schimke.composeai:daemon-core", version.ref = "composeai-tools" }
composeai-daemon-client = { module = "ee.schimke.composeai:daemon-client", version.ref = "composeai-tools" }
composeai-render-session-api = { module = "ee.schimke.composeai:render-session-api", version.ref = "composeai-tools" }
composeai-render-session-subprocess = { module = "ee.schimke.composeai:render-session-subprocess", version.ref = "composeai-tools" }
# Render-matrix axis expansion and contact-sheet composition, shared by the CLI's `render-matrix`
# command and `:mcp`'s `render_matrix` tool. Lifted out of compose-ai-tools' `:mcp` before the
# module moved here, precisely so the offline CLI command did not have to follow it (#5188 there).
composeai-render-matrix = { module = "ee.schimke.composeai:render-matrix", version.ref = "composeai-tools" }
composeai-data-pseudolocale-core = { module = "ee.schimke.composeai:data-pseudolocale-core", version.ref = "composeai-tools" }
composeai-data-remotecompose-core = { module = "ee.schimke.composeai:data-remotecompose-core", version.ref = "composeai-tools" }

composeai-agent-grant-protocol = { module = "ee.schimke.composeai:agent-grant-protocol", version.ref = "composeai-contracts" }
composeai-parity-issues-protocol = { module = "ee.schimke.composeai:parity-issues-protocol", version.ref = "composeai-contracts" }
composeai-common-io = { module = "ee.schimke.composeai:common-io", version.ref = "composeai-contracts" }
composeai-data-layoutinspector-core = { module = "ee.schimke.composeai:data-layoutinspector-core", version.ref = "composeai-contracts" }
composeai-data-theme-core = { module = "ee.schimke.composeai:data-theme-core", version.ref = "composeai-contracts" }
composeai-data-preview-overrides-core = { module = "ee.schimke.composeai:data-preview-overrides-core", version.ref = "composeai-contracts" }
composeai-data-preview-overrides-runtime = { module = "ee.schimke.composeai:data-preview-overrides-runtime", version.ref = "composeai-tools" }
composeai-data-render-core = { module = "ee.schimke.composeai:data-render-core", version.ref = "composeai-contracts" }
composeai-ui-builder-protocol = { module = "ee.schimke.composeai:ui-builder-protocol", version.ref = "composeai-contracts" }
composeai-rc-player-compose = { module = "ee.schimke.composeai:rc-player-compose", version.ref = "rc-players" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
ktor-server-auto-head-response = { module = "io.ktor:ktor-server-auto-head-response", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
mcp-kotlin-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-kotlin-sdk" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphics-shapes" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
ktfmt-cli = { module = "com.facebook:ktfmt", version.ref = "ktfmt-cli" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
compose-preview = { id = "ee.schimke.composeai.preview", version.ref = "composeai-tools" }
