<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the canvas run under a notch and the home indicator; the editor pads
      its own chrome by the safe area instead (`BrowserViewportInsets.kt`). `resizes-content` asks
      Chrome on Android to shrink the page when the keyboard opens, so the Properties sheet stays
      above it. Safari ignores it and overlays the keyboard; the editor reads that from
      `visualViewport` and pads by it.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The boot screen's background, so the browser chrome around it matches before Wasm loads. -->
    <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Compose UI Builder Preview</title>
    <meta name="ui-builder-mcp-server" content="compose-preview-catalog" />
    <meta name="ui-builder-mcp-endpoint" content="/mcp" />
    <link rel="help" href="https://yschimke.github.io/compose-ui-builder/#get-started" />
    <!-- Agent handoff: use compose-preview-catalog at this host's /mcp. Install/load the
         compose-ui-builder skill from https://github.com/yschimke/skills/tree/main/skills/compose-ui-builder.
         Request your own ui-builder-read/write/export grant; read the design and comments before
         edits with baseRevision; verify ui_builder_export. Never reuse browser credentials.
         MCP tools accept optional agentName and agentModel for the participant toolbar. -->
    <!--
      The import map comes before every module preload below, not after them. Chrome fixes a
      page's import map the moment it starts resolving a module's imports, and a modulepreload
      does that as soon as its bytes arrive. On a cold load they are still on the network when the
      parser reaches the map, so the order never showed; on a reload they come straight from the
      immutable cache, `uiBuilder.mjs` is resolved first, and `@js-joda/core` fails to resolve —
      the editor never starts. `ShellImportMapOrderTest` holds this.
    -->
    <script type="importmap">
      { "imports": { "@js-joda/core": "./js-joda.esm.js" } }
    </script>
    <!--
      Preload the module graph, but let its loaders fetch Wasm directly. In Chromium, Wasm
      responses supplied by rel=preload did not consume compiled-code cache entries on repeat
      opens, even though the bytes were cached. Direct streaming fetches preserve that cache.
    -->
    <link rel="modulepreload" href="uiBuilder.mjs" />
    <link rel="modulepreload" href="uiBuilder.import-object.mjs" />
    <link rel="modulepreload" href="skiko.mjs" />
    <link rel="modulepreload" href="js-joda.esm.js" />
    <style>
      :root {
        --boot-bg: #fef7ff;
        --boot-fg: #1d1b20;
        --boot-muted: #49454f;
        --boot-track: #e7e0ec;
        --boot-accent: #6750a4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #141218;
          --boot-fg: #e6e0e9;
          --boot-muted: #cac4d0;
          --boot-track: #36343b;
          --boot-accent: #d0bcff;
        }
      }
      html, body, #composeApp { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      /*
        The dynamic viewport height where the browser has it: `100%` of a phone's initial
        containing block is the height with the address bar hidden, so the bottom dock sat under
        the bar until the page was scrolled — which this page never is.
      */
      html, body { height: 100vh; height: 100dvh; overscroll-behavior: none; }
      body { background: white; }
      #composeApp canvas { display: block; }
      #ui-builder-boot {
        position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
        background: var(--boot-bg); color: var(--boot-fg);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #ui-builder-boot .boot-card { width: min(360px, calc(100vw - 48px)); }
      #ui-builder-boot .boot-title { margin: 0 0 16px; font-size: 18px; font-weight: 600; }
      #ui-builder-boot .boot-phase { margin: 0; font-weight: 500; }
      #ui-builder-boot .boot-detail {
        margin: 0; min-height: 1.45em; color: var(--boot-muted); font-variant-numeric: tabular-nums;
      }
      #ui-builder-boot .boot-track {
        position: relative; height: 4px; margin: 12px 0 16px; overflow: hidden;
        border-radius: 2px; background: var(--boot-track);
      }
      #ui-builder-boot .boot-bar {
        position: absolute; inset: 0; transform-origin: left; background: var(--boot-accent);
        transform: scaleX(0.3); animation: boot-indeterminate 1.4s ease-in-out infinite;
      }
      #ui-builder-boot[data-state="failed"] .boot-bar { animation: none; background: #b3261e; }
      #ui-builder-boot .boot-quip { margin: 0; min-height: 2.9em; color: var(--boot-muted); font-style: italic; }
      @keyframes boot-indeterminate {
        from { transform: translateX(-100%) scaleX(0.3); }
        to { transform: translateX(100%) scaleX(0.3); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ui-builder-boot .boot-bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="composeApp"></div>
    <!--
      Drawn by the browser on first paint, before any script has run, and removed by the editor
      once it has something real to show (`dismissBootScreen` in Main.kt).
    -->
    <div id="ui-builder-boot" role="status" aria-live="polite">
      <div class="boot-card">
        <p class="boot-title">Compose UI Builder</p>
        <p class="boot-phase" data-boot-phase>Loading the editor</p>
        <p class="boot-detail" data-boot-detail></p>
        <div class="boot-track"><div class="boot-bar" data-boot-bar></div></div>
        <p class="boot-quip" data-boot-quip></p>
      </div>
    </div>
    <script src="ui-builder-boot.js"></script>
    <script type="module" src="uiBuilder.mjs"></script>
  </body>
</html>
